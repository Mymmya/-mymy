app = 'moba-vps-pass'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 22
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'performance'
  cpus = 16
  memory_mb = 131072
